# Jeda dalam detik. Perbesar angkanya kalau minigame tidak sempat merespons.
# Koma atau titik sama saja: 0,07 dan 0.07 keduanya sah.
# Simpan file ini, lalu jalankan ulang: py -m spleen_bot --play

[jeda]
# Jeda antara satu klik dan klik berikutnya
klik = 0.07
# Setelah bendera dipasang, sebelum klik angka di sebelahnya
setelah_bendera = 0.12
# Menunggu papan berubah setelah sekumpulan klik
tunggu_papan = 0.60
# Menunggu papan berubah setelah skill 1
tunggu_skill = 0.85
# Kursor diam di atas petak sebelum tombol 1 ditekan
bidik_skill = 0.08
# Jeda antara tombol 1 dan klik kiri, dipakai kalau mode hover tidak membuka petak
skill_lalu_klik = 0.12
# Kursor disingkirkan dari papan sebelum screenshot diambil
singkirkan_kursor = 0.04
# Setelah tombol CONTINUE
setelah_continue = 0.50
# Hitung mundur sebelum bot mulai bermain
mulai = 3
